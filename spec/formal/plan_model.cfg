SPECIFICATION Spec

CONSTANTS
    Actions = {a, b, c}
    Decisions = {"PERMITTED", "FORBIDDEN", "UNDECIDABLE"}
    PlanDecisions = {"PERMITTED", "FORBIDDEN", "UNDECIDABLE"}
    MaxPlanSteps = 3
    StepDecisionMap = [x \in {a, b, c} |-> "PERMITTED"]
    SequenceConstraints = {<<a, b>>}
    AggregateLimits = [x \in {a, b, c} |-> 5]
    NoBlockingViolation = TRUE
    PreconditionRequired = {}

INVARIANT
    Pl_1_Determinism
    Pl_2_PermittedSoundness
    Pl_3_ForbiddenStepDominates
    Pl_4_BlockingViolationDominates
    Pl_5_Termination
